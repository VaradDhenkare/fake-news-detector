services:
  mysql:
    image: mysql:8.0
    container_name: truthlens-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-varad123}
      MYSQL_DATABASE: fakenews_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truthlens-network

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: truthlens-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - HOST=0.0.0.0
      - MODEL_VERSION=${MODEL_VERSION:-1.0.0}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - truthlens-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthlens-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fakenews_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-varad123}
      - APP_JWT_SECRET=${JWT_SECRET:-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml_service:5001}
    depends_on:
      mysql:
        condition: service_healthy
      ml_service:
        condition: service_started
    networks:
      - truthlens-network

  frontend:
    image: nginx:alpine
    container_name: truthlens-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - truthlens-network

volumes:
  mysql_data:
    driver: local

networks:
  truthlens-network:
    driver: bridge
