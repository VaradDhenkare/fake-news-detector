# ──────────────────────────────────────────────
# Server Configuration
# ──────────────────────────────────────────────
server.port=8080

# ──────────────────────────────────────────────
# MySQL DataSource Configuration
# Configurable via environment variables for Docker and Air-gapped deployments
# ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fakenews_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:varad123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ──────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────────
# JWT Security
# ──────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}
app.jwt.expiration-ms=86400000

# ──────────────────────────────────────────────
# External ML Service (FastAPI Microservice)
# Configurable via ML_SERVICE_URL env variable for Docker networking
# ──────────────────────────────────────────────
ml.service.url=${ML_SERVICE_URL:http://localhost:5001}
ml.service.base-url=${ml.service.url}
ml.service.predict-path=/predict
ml.service.predict-url-path=/predict-url
ml.service.live-feed-path=/live-feed
ml.service.timeout-seconds=10

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging.level.com.fakenews=INFO
logging.level.org.springframework.security=WARN
