# ──────────────────────────────────────────────
# Server
# ──────────────────────────────────────────────
server.port=8080

# ──────────────────────────────────────────────
# MySQL DataSource
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/fakenews_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ──────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────────
# JWT
# ──────────────────────────────────────────────
# Use a strong random 256-bit base64 secret in production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ──────────────────────────────────────────────
# External ML Service
# ──────────────────────────────────────────────
ml.service.base-url=http://localhost:5001
ml.service.predict-path=/predict
ml.service.predict-url-path=/predict-url
ml.service.live-feed-path=/live-feed
ml.service.timeout-seconds=10


# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging.level.com.fakenews=INFO
logging.level.org.springframework.security=WARN
